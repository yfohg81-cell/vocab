<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#E4E8E1">

<title>고급영어작문 어휘 100 · 섞어 보기</title>
<style>
  :root{
    --paper:#E4E8E1;
    --card:#F7F9F4;
    --ink:#22292B;
    --ink-soft:#667573;
    --line:#C3CCC2;
    --teal:#20655A;
    --mulberry:#7B2340;
    --gold:#8A7223;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
    font-size:16px; line-height:1.5;
    -webkit-text-size-adjust:100%;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:620px;margin:0 auto}

  .eyebrow{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink-soft);margin:0 0 6px;
  }
  h1{
    font-family:"Nanum Myeongjo","Apple SD Gothic Neo",serif;
    font-weight:700;font-size:26px;line-height:1.25;margin:0 0 4px;
    letter-spacing:-.01em;
  }
  .sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 22px}

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    padding:18px 16px;
    margin-bottom:14px;
  }
  .flabel{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-soft);margin:0 0 8px;
  }
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opt{
    appearance:none;border:1px solid var(--line);background:transparent;
    color:var(--ink);font:inherit;font-size:14px;
    padding:9px 13px;border-radius:2px;cursor:pointer;
    min-height:40px;
  }
  .opt[aria-pressed="true"]{
    background:var(--ink);color:var(--card);border-color:var(--ink);
  }
  .opt:focus-visible,.choice:focus-visible,button:focus-visible,input:focus-visible{
    outline:2px solid var(--gold);outline-offset:2px;
  }
  .range-note{font-size:12.5px;color:var(--ink-soft);margin:10px 0 0}
  .note{font-size:12.5px;color:var(--ink-soft);margin:10px 0 0}

  .start{
    width:100%;margin-top:4px;
    background:var(--ink);color:var(--card);
    border:none;border-radius:3px;
    font:inherit;font-size:16px;font-weight:600;
    padding:15px;cursor:pointer;
  }
  .start:active{transform:translateY(1px)}

  /* page-edge progress */
  .edge{display:flex;gap:2px;align-items:flex-end;height:16px;margin-bottom:14px}
  .tick{flex:1;height:7px;background:var(--line);border-radius:1px;transition:height .18s,background .18s}
  .tick.done{height:14px;background:var(--teal)}
  .tick.miss{height:14px;background:var(--mulberry)}
  .tick.now{height:16px;background:var(--ink)}

  .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:10px}

  .q{
    background:var(--card);border:1px solid var(--line);border-radius:3px;
    padding:26px 18px;text-align:center;margin-bottom:12px;
  }
  .pos{font-size:12px;color:var(--ink-soft);letter-spacing:.08em}
  .prompt{
    font-family:"Nanum Myeongjo","Apple SD Gothic Neo",serif;
    font-size:30px;line-height:1.3;margin:8px 0 2px;word-break:keep-all;
  }
  .prompt.small{font-size:24px}
  .caret{color:var(--ink-soft);font-size:13px;letter-spacing:.3em}

  input[type=text]{
    width:100%;font:inherit;font-size:19px;text-align:center;
    padding:14px 12px;border:1px solid var(--line);border-radius:3px;
    background:var(--card);color:var(--ink);
  }
  .choice{
    display:block;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:3px;
    font:inherit;font-size:16px;padding:14px;margin-bottom:8px;cursor:pointer;
    color:var(--ink);
  }
  .choice .n{color:var(--ink-soft);font-size:12px;margin-right:10px}
  .choice.right{border-color:var(--teal);background:#E7F0EC;color:var(--teal);font-weight:600}
  .choice.wrong{border-color:var(--mulberry);background:#F3E6EA;color:var(--mulberry)}
  .choice[disabled]{cursor:default}

  .verdict{min-height:26px;text-align:center;font-size:15px;margin:10px 0 6px}
  .verdict.right{color:var(--teal);font-weight:600}
  .verdict.wrong{color:var(--mulberry)}
  .verdict b{font-family:"Nanum Myeongjo",serif;font-size:18px}

  .row{display:flex;gap:8px}
  .btn{
    flex:1;font:inherit;font-size:15px;font-weight:600;padding:14px;
    border-radius:3px;border:1px solid var(--ink);
    background:var(--ink);color:var(--card);cursor:pointer;
  }
  .btn.ghost{background:transparent;color:var(--ink)}

  .score{
    background:var(--card);border:1px solid var(--line);border-radius:3px;
    padding:24px 18px;text-align:center;margin-bottom:14px;
  }
  .score .big{
    font-family:"Nanum Myeongjo",serif;font-size:44px;line-height:1;
  }
  .score .of{color:var(--ink-soft);font-size:15px}

  table{width:100%;border-collapse:collapse;font-size:14.5px}
  td{border-bottom:1px solid var(--line);padding:9px 4px;vertical-align:top}
  td.num{color:var(--ink-soft);font-size:12px;width:30px}
  td.w{font-family:"Nanum Myeongjo",serif;font-weight:700;width:38%}
  .yours{display:block;color:var(--mulberry);font-size:12.5px;margin-top:2px}
  .setbtn{display:block;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:3px;padding:16px;margin-bottom:8px;
    cursor:pointer;font:inherit;color:var(--ink)}
  .setbtn b{font-family:"Nanum Myeongjo","Apple SD Gothic Neo",serif;font-weight:700;
    font-size:19px;display:block;margin-bottom:3px}
  .setbtn span{font-size:12.5px;color:var(--ink-soft)}
  .setbar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
  .setbar b{font-size:15px}
  .chg{background:none;border:none;color:var(--ink-soft);font:inherit;font-size:12.5px;
    text-decoration:underline;cursor:pointer;padding:4px}
  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <p class="eyebrow">고급영어작문 어휘 list</p>
  <h1>순서 없이, 섞어서</h1>
  <p class="sub">시작할 때마다 문제 순서와 보기가 새로 섞입니다.</p>

  <!-- SET PICKER -->
  <section id="pick">
    <p class="flabel" style="margin-bottom:10px">단어 세트 고르기</p>
    <div id="setList"></div>
    <p class="note" style="text-align:center;margin-top:14px">버전 2026-09-03</p>
  </section>

  <!-- SETUP -->
  <section id="setup" class="hidden">
    <div class="panel setbar">
      <b id="setName"></b>
      <button class="chg" id="chgSet" type="button">세트 바꾸기</button>
    </div>
    <div class="panel">
      <p class="flabel">범위</p>
      <div class="opts" id="rangeOpts"></div>
      <p class="range-note" id="rangeNote"></p>
    </div>

    <div class="panel">
      <p class="flabel">방향</p>
      <div class="opts" id="modeOpts"></div>
    </div>

    <div class="panel">
      <p class="flabel">문항 수</p>
      <div class="opts" id="countOpts"></div>
    </div>

    <button class="start" id="startBtn">시험 시작</button>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="edge" id="edge"></div>
    <div class="meta">
      <span id="counter"></span>
      <span id="tally"></span>
    </div>

    <div class="q">
      <div class="pos" id="qpos"></div>
      <div class="prompt" id="qprompt"></div>
      <div class="caret" id="qcaret"></div>
    </div>

    <div id="answerArea"></div>
    <div class="verdict" id="verdict"></div>

    <div class="row">
      <button class="btn ghost" id="quitBtn">그만두기</button>
      <button class="btn" id="nextBtn">다음</button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">
    <div class="score">
      <div class="big"><span id="sNum"></span><span class="of" id="sDen"></span></div>
      <div class="of" id="sPct"></div>
    </div>
    <div class="panel" id="missPanel"></div>
    <div class="row">
      <button class="btn" id="retryWrong">틀린 것만 다시</button>
      <button class="btn ghost" id="restart">처음으로</button>
    </div>
  </section>

</div>

var curSet = null;

var $ = function(id){return document.getElementById(id);};

function shuffle(a){
  var b = a.slice();
  for(var i=b.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}
function pool(){
  return WORDS.filter(function(w){return w.no>=cfg.range[0] && w.no<=cfg.range[1];});
}

/* ---------- setup UI ---------- */
var RANGES = [];
function buildRanges(){
  var lo = WORDS[0].no, hi = WORDS[WORDS.length-1].no, out = [];
  out.push({label:"전체 " + lo + "–" + hi, v:[lo,hi]});
  for(var s = lo; s <= hi; s += 25){
    var e = Math.min(s + 24, hi);
    if(e > s) out.push({label:s + "–" + e, v:[s,e]});
  }
  if(hi - lo + 1 > 50){
    var mid = lo + Math.floor((hi - lo + 1) / 2) - 1;
    out.push({label:lo + "–" + mid, v:[lo,mid]});
    out.push({label:(mid+1) + "–" + hi, v:[mid+1,hi]});
  }
  return out;
}
var MODES = [
  {label:"영 → 한 (객관식)", v:"en2ko"},
  {label:"한 → 영 (직접 입력)", v:"ko2en"},
  {label:"섞어서", v:"mix"}
];
var COUNTS = [10,20,30,50,0];

function buildOpts(host, items, getLabel, isOn, onPick){
  host.innerHTML = "";
  items.forEach(function(it){
    var b = document.createElement("button");
    b.className = "opt";
    b.type = "button";
    b.textContent = getLabel(it);
    b.setAttribute("aria-pressed", isOn(it) ? "true" : "false");
    b.onclick = function(){ onPick(it); };
    host.appendChild(b);
  });
}
function renderPick(){
  var host = $("setList");
  host.innerHTML = "";
  SETS.forEach(function(s){
    var b = document.createElement("button");
    b.className = "setbtn"; b.type = "button";
    var t = document.createElement("b"); t.textContent = s.name;
    var d = document.createElement("span");
    d.textContent = s.words.length + "단어 · " + s.words[0].no + "–" + s.words[s.words.length-1].no + "번";
    b.appendChild(t); b.appendChild(d);
    b.onclick = function(){ chooseSet(s); };
    host.appendChild(b);
  });
}
function chooseSet(s){
  curSet = s;
  WORDS = s.words;
  RANGES = buildRanges();
  cfg.range = RANGES[0].v;
  $("setName").textContent = s.name;
  $("pick").classList.add("hidden");
  $("setup").classList.remove("hidden");
  renderSetup();
}
function backToPick(){
  $("setup").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.add("hidden");
  $("pick").classList.remove("hidden");
}
function renderSetup(){
  if(!curSet) return;
  buildOpts($("rangeOpts"), RANGES,
    function(r){return r.label;},
    function(r){return r.v[0]===cfg.range[0] && r.v[1]===cfg.range[1];},
    function(r){cfg.range = r.v; renderSetup();});
  buildOpts($("modeOpts"), MODES,
    function(m){return m.label;},
    function(m){return m.v===cfg.mode;},
    function(m){cfg.mode = m.v; renderSetup();});
  buildOpts($("countOpts"), COUNTS,
    function(c){return c===0 ? "범위 전체" : c+"문제";},
    function(c){return c===cfg.count;},
    function(c){cfg.count = c; renderSetup();});
  $("rangeNote").textContent = "선택한 범위에 " + pool().length + "단어 있습니다.";
}

/* ---------- quiz ---------- */
function makeQuestion(w, p){
  var kind = cfg.mode === "mix" ? (Math.random() < 0.5 ? "en2ko" : "ko2en") : cfg.mode;
  var q = {w:w, kind:kind};
  if(kind === "en2ko"){
    /* 같은 표제어가 뜻만 다르게 두 번 실린 경우(예: clash 25번·69번)
       그 다른 뜻을 오답 보기로 쓰면 정답이 둘이 되므로 제외한다. */
    var usable = p.filter(function(x){ return x.mean !== w.mean && x.word !== w.word; });
    var same = usable.filter(function(x){return x.pos===w.pos;});
    var other = usable.filter(function(x){return x.pos!==w.pos;});
    var picks = shuffle(same).slice(0,3);
    if(picks.length < 3) picks = picks.concat(shuffle(other).slice(0, 3-picks.length));
    q.choices = shuffle(picks.concat([w]));
  }
  return q;
}
function buildDeck(list){
  var p = pool();
  deck = list.map(function(w){return makeQuestion(w, p);});
  idx = 0; correctCount = 0; misses = [];
  $("setup").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  drawEdge();
  showQuestion();
}
function startNew(){
  var p = shuffle(pool());
  var n = cfg.count === 0 ? p.length : Math.min(cfg.count, p.length);
  buildDeck(p.slice(0, n));
}
function drawEdge(){
  var e = $("edge");
  e.innerHTML = "";
  for(var i=0;i<deck.length;i++){
    var t = document.createElement("div");
    t.className = "tick";
    e.appendChild(t);
  }
}
function paintEdge(){
  var ticks = $("edge").children;
  for(var i=0;i<ticks.length;i++){
    var c = "tick";
    if(deck[i].result === true) c += " done";
    else if(deck[i].result === false) c += " miss";
    else if(i === idx) c += " now";
    ticks[i].className = c;
  }
}
function showQuestion(){
  graded = false;
  var q = deck[idx];
  $("counter").textContent = (idx+1) + " / " + deck.length;
  $("tally").textContent = "맞은 개수 " + correctCount;
  $("verdict").textContent = "";
  $("verdict").className = "verdict";
  $("nextBtn").textContent = "확인";
  paintEdge();

  var area = $("answerArea");
  area.innerHTML = "";

  if(q.kind === "en2ko"){
    $("qpos").textContent = q.w.pos;
    $("qprompt").textContent = q.w.word;
    $("qprompt").className = "prompt" + (q.w.word.length > 14 ? " small" : "");
    $("qcaret").textContent = "뜻 고르기";
    q.choices.forEach(function(c, i){
      var b = document.createElement("button");
      b.className = "choice";
      b.type = "button";
      b.innerHTML = '<span class="n">' + (i+1) + '</span>';
      b.appendChild(document.createTextNode(c.mean));
      b.onclick = function(){ if(!graded) grade(c.mean === q.w.mean, c.mean, b); };
      area.appendChild(b);
    });
    $("nextBtn").textContent = "다음";
  } else {
    $("qpos").textContent = q.w.pos;
    $("qprompt").textContent = q.w.mean;
    $("qprompt").className = "prompt small";
    var parts = String(q.w.word).replace(/\([^)]*\)/g, " ").trim().split(/\s+/).filter(Boolean);
    $("qcaret").textContent = parts.length > 1 ? "‸ 영어로 쓰기 (" + parts.length + "단어)" : "‸ 영단어 쓰기";
    var inp = document.createElement("input");
    inp.type = "text";
    inp.id = "typed";
    inp.autocapitalize = "none";
    inp.autocomplete = "off";
    inp.spellcheck = false;
    inp.placeholder = "영어로 입력";
    inp.onkeydown = function(e){ if(e.key === "Enter"){ e.preventDefault(); onNext(); } };
    area.appendChild(inp);
    inp.focus();
  }
}
function norm(s){ return (s||"").toLowerCase().replace(/[^a-z]/g,""); }

/* "(fee) excessive" 처럼 괄호가 붙은 표제어는 괄호를 빼고 써도 정답으로 본다. */
function accepted(word){
  var full = norm(word);
  var bare = norm(String(word).replace(/\([^)]*\)/g, " "));
  var out = [full];
  if(bare && out.indexOf(bare) === -1) out.push(bare);
  return out;
}
function isMatch(typed, word){
  var t = norm(typed);
  if(!t) return false;
  return accepted(word).indexOf(t) > -1;
}

function grade(ok, given, btn){
  graded = true;
  var q = deck[idx];
  q.result = ok;
  q.given = given;
  if(ok){ correctCount++; } else { misses.push(q); }

  var v = $("verdict");
  if(ok){
    v.className = "verdict right";
    v.textContent = "맞았습니다";
  } else {
    v.className = "verdict wrong";
    v.innerHTML = "정답 <b>" + (q.kind === "en2ko" ? q.w.mean : q.w.word) + "</b>";
  }
  if(q.kind === "en2ko"){
    var nodes = $("answerArea").children;
    for(var i=0;i<nodes.length;i++){
      nodes[i].disabled = true;
      if(q.choices[i].mean === q.w.mean) nodes[i].className = "choice right";
      else if(nodes[i] === btn) nodes[i].className = "choice wrong";
    }
  } else {
    var inp = $("typed");
    if(inp){ inp.disabled = true; }
  }
  $("tally").textContent = "맞은 개수 " + correctCount;
  paintEdge();
  $("nextBtn").textContent = (idx === deck.length-1) ? "결과 보기" : "다음";
}
function onNext(){
  var q = deck[idx];
  if(!graded){
    if(q.kind === "ko2en"){
      var inp = $("typed");
      var typed = inp ? inp.value : "";
      grade(isMatch(typed, q.w.word), typed.trim(), null);
    }
    return;
  }
  if(idx === deck.length-1){ showResult(); }
  else { idx++; showQuestion(); }
}
function showResult(){
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("sNum").textContent = correctCount;
  $("sDen").textContent = " / " + deck.length;
  $("sPct").textContent = Math.round(correctCount/deck.length*100) + "점";

  var host = $("missPanel");
  host.innerHTML = "";
  var head = document.createElement("p");
  head.className = "flabel";
  if(misses.length === 0){
    head.textContent = "틀린 단어";
    var none = document.createElement("p");
    none.style.margin = "0";
    none.style.fontSize = "14.5px";
    none.textContent = "없습니다. 전부 맞았습니다.";
    host.appendChild(head);
    host.appendChild(none);
    $("retryWrong").disabled = true;
    $("retryWrong").style.opacity = ".4";
  } else {
    head.textContent = "틀린 단어 " + misses.length + "개";
    host.appendChild(head);
    var t = document.createElement("table");
    host.appendChild(t);
    $("retryWrong").disabled = false;
    $("retryWrong").style.opacity = "1";
    misses.forEach(function(q){
      var tr = document.createElement("tr");
      var td1 = document.createElement("td"); td1.className = "num"; td1.textContent = q.w.no;
      var td2 = document.createElement("td"); td2.className = "w"; td2.textContent = q.w.word;
      var td3 = document.createElement("td");
      td3.textContent = q.w.mean;
      if(q.given){
        var s = document.createElement("span");
        s.className = "yours";
        s.textContent = "내 답 " + q.given;
        td3.appendChild(s);
      }
      tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
      t.appendChild(tr);
    });
  }
}

/* ---------- wiring ---------- */
$("startBtn").onclick = startNew;
$("nextBtn").onclick = onNext;
$("quitBtn").onclick = function(){
  if(idx > 0 || graded){ showResult(); }
  else { $("quiz").classList.add("hidden"); $("setup").classList.remove("hidden"); }
};
$("restart").onclick = function(){
  $("result").classList.add("hidden");
  $("setup").classList.remove("hidden");
};
$("chgSet").onclick = backToPick;
$("retryWrong").onclick = function(){
  var again = shuffle(misses.map(function(q){return q.w;}));
  buildDeck(again);
};
document.addEventListener("keydown", function(e){
  if(e.key === "Enter" && !$("quiz").classList.contains("hidden")){
    if(document.activeElement && document.activeElement.id === "typed") return;
    e.preventDefault();
    onNext();
  }
});
renderPick();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
