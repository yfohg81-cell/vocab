<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="단어카드">
<meta name="theme-color" content="#E4E8E1">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>고급영어작문 어휘 100 · 카드 반복</title>
<style>
  :root{
    --paper:#E4E8E1;
    --card:#FBFCF8;
    --ink:#22292B;
    --ink-soft:#68766F;
    --line:#C3CCC2;
    --rule:#CBD8DE;
    --teal:#20655A;
    --mulberry:#8A2743;
    --gold:#8A7223;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:600px;margin:0 auto}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px}
  h1{font-family:"Nanum Myeongjo","Apple SD Gothic Neo",serif;font-weight:700;font-size:25px;line-height:1.25;margin:0 0 4px}
  .sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 20px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:16px;margin-bottom:12px}
  .flabel{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opt{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);
    font:inherit;font-size:14px;padding:9px 13px;border-radius:2px;cursor:pointer;min-height:40px}
  .opt[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .note{font-size:12.5px;color:var(--ink-soft);margin:10px 0 0}
  .opt:focus-visible,button:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .start{width:100%;background:var(--ink);color:var(--card);border:none;border-radius:3px;
    font:inherit;font-size:16px;font-weight:600;padding:15px;cursor:pointer}
  .linkbtn{display:block;width:100%;margin-top:10px;background:none;border:none;
    color:var(--ink-soft);font:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:6px}

  /* study */
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
  .bar > i{display:block;height:100%;width:0;background:var(--teal);transition:width .25s}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:14px}

  .card{-webkit-perspective:1200px;perspective:1200px;width:100%;cursor:pointer;display:block;margin-bottom:14px;
    -webkit-tap-highlight-color:transparent}
  .inner{position:relative;width:100%;min-height:250px;
    -webkit-transition:-webkit-transform .38s cubic-bezier(.3,.7,.3,1);
    transition:transform .38s cubic-bezier(.3,.7,.3,1);
    -webkit-transform-style:preserve-3d;transform-style:preserve-3d}
  .card.flipped .inner{-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
  .face{
    position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--line);border-radius:3px;padding:26px 18px;
    -webkit-backface-visibility:hidden;backface-visibility:hidden;
    background-image:linear-gradient(var(--paper) 1px,transparent 1px);
    background-size:100% 34px;background-position:0 40px;
  }
  .face::before{content:"";position:absolute;left:0;right:0;top:26px;height:1px;background:var(--mulberry);opacity:.55}
  .face.back{-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
  .no{position:absolute;top:6px;left:12px;font-size:11px;color:var(--ink-soft);letter-spacing:.1em}
  .pos{position:absolute;top:6px;right:12px;font-size:11px;color:var(--ink-soft)}
  .term{font-family:"Nanum Myeongjo","Apple SD Gothic Neo",serif;font-size:34px;line-height:1.25;
    word-break:break-word;text-align:center;margin:0}
  .term.ko{font-size:26px;word-break:keep-all}
  .term.sm{font-size:24px;word-break:keep-all}
  .term.ko.sm{font-size:21px}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:16px;letter-spacing:.04em}
  .streak{font-size:11.5px;color:var(--ink-soft);margin-top:10px}

  .row{display:flex;gap:8px}
  .btn{flex:1;font:inherit;font-size:16px;font-weight:600;padding:16px 10px;border-radius:3px;cursor:pointer}
  .btn.know{background:var(--teal);color:#fff;border:1px solid var(--teal)}
  .btn.dunno{background:transparent;color:var(--mulberry);border:1px solid var(--mulberry)}
  .btn.wide{background:var(--ink);color:var(--card);border:1px solid var(--ink)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
  .quit{display:block;width:100%;margin-top:12px;background:none;border:none;color:var(--ink-soft);
    font:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:6px}

  /* done */
  .score{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:24px 18px;text-align:center;margin-bottom:12px}
  .score .big{font-family:"Nanum Myeongjo",serif;font-size:40px;line-height:1}
  .score .of{color:var(--ink-soft);font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  td{border-bottom:1px solid var(--line);padding:8px 4px;vertical-align:top}
  td.num{color:var(--ink-soft);font-size:12px;width:32px}
  td.w{font-family:"Nanum Myeongjo",serif;font-weight:700;width:38%}
  td.cnt{color:var(--mulberry);font-size:12.5px;text-align:right;white-space:nowrap}
  .setbtn{display:block;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:3px;padding:16px;margin-bottom:8px;
    cursor:pointer;font:inherit;color:var(--ink)}
  .setbtn b{font-family:"Nanum Myeongjo","Apple SD Gothic Neo",serif;font-weight:700;
    font-size:19px;display:block;margin-bottom:3px}
  .setbtn span{font-size:12.5px;color:var(--ink-soft)}
  .setbar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
  .setbar b{font-size:15px}
  .chg{background:none;border:none;color:var(--ink-soft);font:inherit;font-size:12.5px;
    text-decoration:underline;cursor:pointer;padding:4px}
  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){.inner,.bar > i{transition:none}}
</style>
</head>
<body>
<div class="wrap">

  <p class="eyebrow">고급영어작문 어휘 list</p>
  <h1>카드 반복</h1>
  <p class="sub">영어를 보고 뜻을 떠올린 뒤 카드를 뒤집어 직접 채점합니다. 틀린 카드는 곧바로 다시 순서가 돌아오고, 맞힌 카드는 점점 뒤로 밀립니다. 세 번 연속 맞히면 그 세션에서 빠집니다.</p>

  <!-- SET PICKER -->
  <section id="pick">
    <p class="flabel" style="margin-bottom:10px">단어 세트 고르기</p>
    <div id="setList"></div>
    <p class="note" style="text-align:center;margin-top:14px">버전 2026-09-03</p>
  </section>

  <!-- SETUP -->
  <section id="setup" class="hidden">
    <div class="panel setbar">
      <b id="setName"></b>
      <button class="chg" id="chgSet" type="button">세트 바꾸기</button>
    </div>
    <div class="panel">
      <p class="flabel">범위</p>
      <div class="opts" id="rangeOpts"></div>
    </div>
    <div class="panel">
      <p class="flabel">이번 세션 카드 수</p>
      <div class="opts" id="sizeOpts"></div>
      <p class="note" id="sizeNote"></p>
    </div>
    <button class="start" id="startBtn">시작</button>
    <button class="linkbtn" id="resetAll">모든 세트의 학습 기록 지우기</button>
    <p class="note" id="storeNote" style="text-align:center"></p>
  </section>

  <!-- STUDY -->
  <section id="study" class="hidden">
    <div class="bar"><i id="barFill"></i></div>
    <div class="meta">
      <span id="left"></span>
      <span id="doneCount"></span>
    </div>

    <div class="card" id="card" role="button" tabindex="0" aria-label="카드 뒤집기">
      <div class="inner">
        <div class="face front">
          <span class="no" id="fNo"></span>
          <span class="pos" id="fPos"></span>
          <p class="term" id="fTerm"></p>
          <p class="hint" id="fHint">눌러서 뜻 확인</p>
        </div>
        <div class="face back">
          <span class="no" id="bNo"></span>
          <span class="pos" id="bPos"></span>
          <p class="term ko" id="bTerm"></p>
          <p class="streak" id="bStreak"></p>
          <p class="hint" id="bHint">눌러서 앞면</p>
        </div>
      </div>
    </div>

    <div id="preFlip">
      <button class="btn wide" id="flipBtn" style="width:100%">뜻 보기</button>
    </div>
    <div id="postFlip" class="row hidden">
      <button class="btn dunno" id="noBtn">몰랐음</button>
      <button class="btn know" id="yesBtn">알았음</button>
    </div>
    <button class="quit" id="quitBtn">여기서 끝내기</button>
  </section>

  <!-- DONE -->
  <section id="done" class="hidden">
    <div class="score">
      <div class="big" id="dBig"></div>
      <div class="of" id="dSub"></div>
    </div>
    <div class="panel" id="hardPanel"></div>
    <div class="row">
      <button class="btn ghost" id="againBtn">틀렸던 카드만 다시</button>
      <button class="btn wide" id="homeBtn">처음으로</button>
    </div>
  </section>

</div>

/* ================= scheduler (pure) ================= */
/* level: 장기 기록 0~3. 3이면 외운 것으로 본다.
   streak: 이번 세션에서 연속으로 "알았음" 한 횟수. 3이 되면 세션 종료 카드.
   틀리면 streak 0 으로 되돌리고 3~5장 뒤에 다시 넣는다.
   맞히면 8~11장 뒤, 그다음은 20~25장 뒤로 밀린다. */
var GAP = { wrong:[3,5], s1:[8,11], s2:[20,25] };
var GOAL = 3;        /* 3번 연속 맞히면 이번 세션에서 빠진다 */
var MAX_WRONG = 6;   /* 한 세션에서 6번 틀리면 잠시 보류해 세션이 끝나게 한다 */

var seqCounter = 0;

function rint(a,b,rnd){ return a + Math.floor((rnd?rnd():Math.random()) * (b-a+1)); }

/* 카드마다 "몇 번째 차례에 다시 볼지(due)"를 적어 둔다.
   차례(now)는 답할 때마다 1씩 늘어나므로 뒤로 밀린 카드에도 반드시 차례가 온다. */
function answerCard(card, ok, now, rnd){
  card.seen++;
  if(ok){
    card.streak++;
    if(card.streak >= GOAL){ card.finished = true; return -1; }
    var g = card.streak === 1 ? GAP.s1 : GAP.s2;
    card.due = now + rint(g[0], g[1], rnd);
  } else {
    card.streak = 0;
    card.wrong++;
    if(card.wrong >= MAX_WRONG){ card.parked = true; return -1; }
    card.due = now + rint(GAP.wrong[0], GAP.wrong[1], rnd);
  }
  card.seq = ++seqCounter;
  return card.due;
}

/* due 가 가장 이른 카드, 같으면 먼저 예약된 카드. 방금 본 카드는 건너뛴다. */
function pickNext(active, last){
  var best = null;
  for(var i=0;i<active.length;i++){
    var c = active[i];
    if(c === last && active.length > 1) continue;
    if(!best || c.due < best.due || (c.due === best.due && c.seq < best.seq)) best = c;
  }
  return best;
}

/* 세션 시작 카드 만들기: 잘 아는 단어는 시작 streak 를 높여 적게 나오게 한다. */
function makeCards(words, levels){
  return words.map(function(w, i){
    var lv = (levels && levels[w.key] && levels[w.key].lv) || 0;
    var start = lv >= 3 ? 2 : (lv === 2 ? 1 : 0);   /* 남은 횟수: 1회 / 2회 / 3회 */
    return {w:w, streak:start, seen:0, wrong:0, finished:false, parked:false, startStreak:start, due:i, seq:i};
  });
}

function shuffle(a, rnd){
  var b = a.slice();
  for(var i=b.length-1;i>0;i--){
    var j = Math.floor((rnd?rnd():Math.random())*(i+1));
    var t=b[i]; b[i]=b[j]; b[j]=t;
  }
  return b;
}

/* 약한 단어 우선으로 세션 카드 뽑기 */
function pickWords(pool, n, levels){
  if(n <= 0 || n >= pool.length) return shuffle(pool);
  var scored = shuffle(pool).map(function(w){
    var rec = (levels && levels[w.key]) || {lv:0, wrong:0};
    return {w:w, score:(rec.lv||0) - Math.min(3, rec.wrong||0)};
  });
  scored.sort(function(a,b){ return a.score - b.score; });
  return shuffle(scored.slice(0, n).map(function(s){ return s.w; }));
}

var KEY = "vocab:levels";
var OLD_KEY = "vocab100:levels";   /* 세트 기능 이전에 쓰던 키 */

/* 예전 기록은 단어 이름으로 저장돼 있었다. 1번 세트 기록으로 옮긴다. */
function migrate(oldMap){
  var byWord = {}, out = {};
  SETS[0].words.forEach(function(w){ byWord[w.word] = w.key; });
  Object.keys(oldMap || {}).forEach(function(k){
    if(byWord[k]) out[byWord[k]] = oldMap[k];
  });
  return out;
}
var levels = {};          /* 카드 key -> {lv, wrong} */
var storeOk = false, backend = "none", saveTimer = null;

function applyRaw(v, isOld){
  if(!v) return;
  try{
    var o = JSON.parse(v) || {};
    levels = isOld ? migrate(o) : o;
  }catch(e){ levels = {}; }
}
function writeRaw(v){
  if(backend === "artifact"){
    try{ window.storage.set(KEY, v, false).catch(function(){}); }catch(e){}
  }else if(backend === "local"){
    try{ window.localStorage.setItem(KEY, v); }catch(e){}
  }
}

/* 저장소가 두 가지다.
   claude.ai 안에서는 아티팩트 저장소, 직접 올린 웹앱에서는 브라우저 저장소를 쓴다.
   둘 다 없으면 이번 세션 동안만 기억한다. */
function loadLevels(){
  return new Promise(function(resolve){
    try{
      if(window.storage && window.storage.get && window.storage.set){
        backend = "artifact";
        window.storage.get(KEY, false).then(function(res){
          applyRaw(res && res.value, false);
          resolve(true);
        }).catch(function(){
          window.storage.get(OLD_KEY, false).then(function(res){
            applyRaw(res && res.value, true);
            resolve(true);
          }).catch(function(){ resolve(true); });
        });
        return;
      }
    }catch(e){}
    try{
      var ls = window.localStorage;
      ls.setItem("vocab:probe", "1");
      ls.removeItem("vocab:probe");
      backend = "local";
      var v = ls.getItem(KEY);
      if(v) applyRaw(v, false);
      else applyRaw(ls.getItem(OLD_KEY), true);
      resolve(true);
      return;
    }catch(e){}
    resolve(false);
  });
}
function saveLevels(){
  if(!storeOk) return;
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ writeRaw(JSON.stringify(levels)); }, 800);
}
function bumpLevel(word, ok){
  var rec = levels[word] || {lv:0, wrong:0};
  if(ok){ rec.lv = Math.min(3, rec.lv + 1); }
  else { rec.lv = 0; rec.wrong = (rec.wrong || 0) + 1; }
  levels[word] = rec;
  saveLevels();
}

    b.textContent = label(it);
    b.setAttribute("aria-pressed", on(it) ? "true" : "false");
    b.onclick = function(){ pick(it); };
    host.appendChild(b);
  });
}
function renderPick(){
  var host = $("setList");
  host.innerHTML = "";
  SETS.forEach(function(s){
    var learned = 0;
    s.words.forEach(function(w){ if(levels[w.key] && levels[w.key].lv >= 3) learned++; });
    var b = document.createElement("button");
    b.className = "setbtn"; b.type = "button";
    var t = document.createElement("b"); t.textContent = s.name;
    var d = document.createElement("span");
    d.textContent = s.words.length + "단어 · 외움 " + learned + "개";
    b.appendChild(t); b.appendChild(d);
    b.onclick = function(){ chooseSet(s); };
    host.appendChild(b);
  });
}
function chooseSet(s){
  curSet = s;
  WORDS = s.words;
  RANGES = buildRanges();
  cfg.range = RANGES[0].v;
  $("setName").textContent = s.name;
  $("pick").classList.add("hidden");
  $("setup").classList.remove("hidden");
  renderSetup();
}
function backToPick(){
  $("setup").classList.add("hidden");
  $("study").classList.add("hidden");
  $("done").classList.add("hidden");
  $("pick").classList.remove("hidden");
  renderPick();
}
function renderSetup(){
  if(!curSet) return;
  buildOpts($("rangeOpts"), RANGES, function(r){return r.label;},
    function(r){return r.v[0]===cfg.range[0] && r.v[1]===cfg.range[1];},
    function(r){ cfg.range = r.v; renderSetup(); });
  buildOpts($("sizeOpts"), SIZES, function(s){return s===0 ? "범위 전체" : s+"장";},
    function(s){return s===cfg.size;},
    function(s){ cfg.size = s; renderSetup(); });

  var p = poolWords();
  var known = 0;
  p.forEach(function(w){ if(levels[w.key] && levels[w.key].lv >= 3) known++; });
  $("sizeNote").textContent = "범위 안 " + p.length + "단어 중 외운 것으로 기록된 단어 " + known + "개. 약한 단어가 먼저 뽑힙니다.";
}

/* ================= session ================= */
function startSession(words){
  all = makeCards(words, levels);
  active = all.slice();
  seqCounter = all.length;
  now = 0; last = null; sessionSeen = 0;
  $("setup").classList.add("hidden");
  $("done").classList.add("hidden");
  $("study").classList.remove("hidden");
  nextCard();
}
function nextCard(){
  if(active.length === 0){ finish(); return; }
  cur = pickNext(active, last);
  if(!cur){ finish(); return; }
  flipped = false;
  revealed = false;
  $("card").classList.remove("flipped");
  $("fHint").textContent = "눌러서 뜻 확인";
  $("preFlip").classList.remove("hidden");
  $("postFlip").classList.add("hidden");

  $("fNo").textContent = cur.w.no;
  $("bNo").textContent = cur.w.no;
  $("fPos").textContent = cur.w.pos;
  $("bPos").textContent = cur.w.pos;
  $("fTerm").textContent = cur.w.word;
  $("fTerm").className = "term" + (cur.w.word.length > 14 ? " sm" : "");
  $("bTerm").textContent = cur.w.mean;
  $("bTerm").className = "term ko" + (cur.w.mean.length > 18 ? " sm" : "");
  var remain = GOAL - cur.streak;
  $("bStreak").textContent = "이 카드까지 남은 확인 " + remain + "번";

  var finishedCount = all.filter(function(c){ return c.finished; }).length;
  $("barFill").style.width = Math.round(finishedCount / all.length * 100) + "%";
  $("left").textContent = "남은 카드 " + active.length + "장";
  $("doneCount").textContent = "외움 " + finishedCount + " / " + all.length;
}
/* 앞뒤로 몇 번이든 뒤집을 수 있다.
   뜻을 한 번이라도 본 뒤에는 어느 면을 보고 있든 채점 버튼이 남아 있는다. */
function flip(){
  if(!cur) return;
  flipped = !flipped;
  if(flipped){
    revealed = true;
    $("card").classList.add("flipped");
    $("fHint").textContent = "눌러서 뒤집기";
  }else{
    $("card").classList.remove("flipped");
  }
  if(revealed){
    $("preFlip").classList.add("hidden");
    $("postFlip").classList.remove("hidden");
  }
}
function answer(ok){
  if(!revealed || !cur) return;
  sessionSeen++;
  now++;
  answerCard(cur, ok, now);
  if(cur.finished || cur.parked){
    var i = active.indexOf(cur);
    if(i > -1) active.splice(i, 1);
  }
  last = cur;
  bumpLevel(cur.w.key, ok);
  nextCard();
}
function finish(){
  $("study").classList.add("hidden");
  $("done").classList.remove("hidden");
  var fin = all.filter(function(c){ return c.finished; }).length;
  $("dBig").textContent = fin + " / " + all.length;
  $("dSub").textContent = "카드 " + sessionSeen + "번 확인함";

  var hard = all.filter(function(c){ return c.wrong > 0; })
                .sort(function(a,b){ return b.wrong - a.wrong; });
  var host = $("hardPanel");
  host.innerHTML = "";
  var t = document.createElement("p");
  t.className = "flabel";
  if(hard.length === 0){
    t.textContent = "한 번도 틀리지 않았습니다";
    host.appendChild(t);
    $("againBtn").disabled = true;
    $("againBtn").style.opacity = ".4";
  }else{
    t.textContent = "틀렸던 단어 " + hard.length + "개";
    host.appendChild(t);
    var parked = all.filter(function(c){ return c.parked; }).length;
    if(parked > 0){
      var pn = document.createElement("p");
      pn.className = "note";
      pn.style.margin = "0 0 10px";
      pn.textContent = parked + "개는 " + MAX_WRONG + "번 이상 틀려서 이번 세션에서 잠시 뺐습니다. 아래에서 다시 시작할 수 있습니다.";
      host.appendChild(pn);
    }
    var tb = document.createElement("table");
    hard.forEach(function(c){
      var tr = document.createElement("tr");
      var a = document.createElement("td"); a.className="num"; a.textContent = c.w.no;
      var b = document.createElement("td"); b.className="w"; b.textContent = c.w.word;
      var d = document.createElement("td"); d.textContent = c.w.mean;
      var e = document.createElement("td"); e.className="cnt";
      e.textContent = c.wrong + "회" + (c.parked ? " 보류" : "");
      tr.appendChild(a); tr.appendChild(b); tr.appendChild(d); tr.appendChild(e);
      tb.appendChild(tr);
    });
    host.appendChild(tb);
    $("againBtn").disabled = false;
    $("againBtn").style.opacity = "1";
  }
}

/* ================= wiring ================= */
$("startBtn").onclick = function(){
  var words = pickWords(poolWords(), cfg.size, levels);
  if(words.length === 0) return;
  startSession(words);
};
$("card").onclick = flip;
$("flipBtn").onclick = function(e){ e.stopPropagation(); flip(); };
$("yesBtn").onclick = function(){ answer(true); };
$("noBtn").onclick = function(){ answer(false); };
$("quitBtn").onclick = finish;
$("homeBtn").onclick = function(){
  $("done").classList.add("hidden");
  $("setup").classList.remove("hidden");
  renderSetup();
};
$("chgSet").onclick = backToPick;
$("againBtn").onclick = function(){
  var again = all.filter(function(c){ return c.wrong > 0; }).map(function(c){ return c.w; });
  if(again.length === 0) return;
  startSession(shuffle(again));
};
$("resetAll").onclick = function(){
  levels = {};
  if(storeOk) writeRaw("{}");
  renderPick();
  renderSetup();
  $("storeNote").textContent = "기록을 지웠습니다." + (storeOk ? "" : " (이 브라우저에서는 저장이 지원되지 않아 세션 동안만 유지됩니다.)");
};
document.addEventListener("keydown", function(e){
  if($("study").classList.contains("hidden")) return;
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); }
  else if(e.key === "1"){ answer(false); }
  else if(e.key === "2"){ answer(true); }
});

loadLevels().then(function(ok){
  storeOk = ok;
  $("storeNote").textContent = ok
    ? "학습 기록이 저장되어 다음에도 이어집니다."
    : "이 환경에서는 기록이 저장되지 않아 창을 닫으면 초기화됩니다.";
  renderPick();
  renderSetup();
});
renderPick();
</script>

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
