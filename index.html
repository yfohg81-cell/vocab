<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고급영어 어휘</title>
<style>
  body{margin:0;background:#E4E8E1;color:#22292B;
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
    padding:calc(28px + env(safe-area-inset-top)) 16px 40px}
  .wrap{max-width:600px;margin:0 auto}
  p.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#68766F;margin:0 0 6px}
  h1{font-family:"Nanum Myeongjo","Apple SD Gothic Neo",serif;font-size:25px;margin:0 0 20px}
  a{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    background:#FBFCF8;border:1px solid #C3CCC2;border-radius:3px;padding:16px;margin-bottom:10px}
  img{width:52px;height:52px;border-radius:11px;border:1px solid #C3CCC2}
  b{font-family:"Nanum Myeongjo","Apple SD Gothic Neo",serif;font-size:19px;display:block;margin-bottom:3px}
  span{font-size:12.5px;color:#68766F}
  .note{font-size:12.5px;color:#68766F;line-height:1.6;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">고급영어작문 · 고급영어토론</p>
  <h1>어휘 학습</h1>
  <a href="./cards/"><img src="./cards/icon-192.png" alt=""><span><b>단어 카드</b>
    <span>뒤집어 외우는 반복 학습</span></span></a>
  <a href="./quiz/"><img src="./quiz/icon-192.png" alt=""><span><b>단어 시험</b>
    <span>순서를 섞어서 보는 시험</span></span></a>
  <p class="note">홈 화면에 추가할 때는 이 페이지가 아니라 각각의 앱을 연 뒤에 추가하세요.
    두 앱은 서로 다른 앱으로 설치됩니다.</p>
</div>
</body>
</html>
